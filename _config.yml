title: "Parker's Place"
description: "Engineering, writing, projects, and things worth keeping."
url: "https://rparkere.github.io"
baseurl: "/parker-site"

markdown: kramdown
highlighter: rouge

plugins:
  - jekyll-feed
permalink: /writing/:year/:month/:day/:title/

defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: post

exclude:
  - README.md
  - Gemfile
  - Gemfile.lock

repository_url: "https://github.com/RParkerE/parker-site"
